<div class="login-page">
  <div class="login-card">
    <a class="login-brand" routerLink="/">
      <div class="brand-core"><span>&lt;/&gt;</span></div>
      <div class="brand-text">
        <strong>DevPrep</strong><span>Hub</span>
      </div>
    </a>

    <h1>Sign In</h1>
    <p class="login-subtitle">Access your dashboard to manage content.</p>

    @if (error()) {
      <div class="login-error">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          autocomplete="current-password"
        />
      </div>

      <button class="login-submit" type="submit" [disabled]="loading() || !email() || !password()">
        @if (loading()) {
          Signing in...
        } @else {
          Sign In
        }
      </button>
    </form>
  </div>
</div>
